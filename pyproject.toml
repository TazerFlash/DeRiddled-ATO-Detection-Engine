[project]
name = "de-riddled"
version = "0.1.0"
description = "Real-time account-takeover (ATO) risk scoring on the RBA login dataset"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=2.7.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "mlflow>=3.17.2",
    "networkx>=3.6.1",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pycountry>=26.2.16",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deriddled"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]
