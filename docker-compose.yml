# API + MLflow UI; set DERIDDLED_DATA to the real data folder (Docker may not follow the data/ junction).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - "${DERIDDLED_DATA:-./data}:/app/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlflow:
    build: .
    command: ["mlflow", "ui", "--backend-store-uri", "sqlite:////app/data/ops/mlflow.db", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    volumes:
      - "${DERIDDLED_DATA:-./data}:/app/data"
